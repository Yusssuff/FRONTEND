<div class="min-h-screen bg-slate-950 flex items-center justify-center p-6">

  <!-- ========================= -->
  <!-- LOGIN -->
  <!-- ========================= -->

  <div
    *ngIf="!isRegisterMode"
    class="w-full max-w-md rounded-3xl bg-white p-8 shadow-2xl"
  >

    <!-- Header -->

    <div class="mb-8 text-center">

      <div
        class="mx-auto mb-4 flex h-14 w-14 items-center justify-center
               rounded-2xl bg-indigo-600 text-2xl text-white shadow-lg"
      >
        🔐
      </div>

      <h1 class="text-3xl font-bold text-slate-900">
        Welcome Back
      </h1>

      <p class="mt-2 text-slate-500">
        Login to your account
      </p>

    </div>


    <!-- Error -->

    <div
      *ngIf="errorMessage"
      class="mb-5 rounded-xl border border-red-200
             bg-red-50 px-4 py-3 text-sm text-red-700"
    >
      {{ errorMessage }}
    </div>


    <!-- Success -->

    <div
      *ngIf="successMessage"
      class="mb-5 rounded-xl border border-green-200
             bg-green-50 px-4 py-3 text-sm text-green-700"
    >
      {{ successMessage }}
    </div>


    <!-- Login Form -->

    <form
      class="space-y-5"
      (ngSubmit)="login()"
    >

      <!-- Username -->

      <div>

        <label
          for="loginUsername"
          class="mb-2 block text-sm font-semibold text-slate-700"
        >
          Username
        </label>

        <input
          id="loginUsername"
          name="loginUsername"
          type="text"
          [(ngModel)]="name"
          placeholder="Enter your username"
          autocomplete="username"
          required
          class="w-full rounded-xl border border-slate-300
                 bg-white px-4 py-3 text-slate-900
                 outline-none transition
                 placeholder:text-slate-400
                 focus:border-indigo-500
                 focus:ring-4
                 focus:ring-indigo-100"
        />

      </div>


      <!-- Password -->

      <div>

        <label
          for="loginPassword"
          class="mb-2 block text-sm font-semibold text-slate-700"
        >
          Password
        </label>

        <input
          id="loginPassword"
          name="loginPassword"
          type="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
          class="w-full rounded-xl border border-slate-300
                 bg-white px-4 py-3 text-slate-900
                 outline-none transition
                 placeholder:text-slate-400
                 focus:border-indigo-500
                 focus:ring-4
                 focus:ring-indigo-100"
        />

      </div>


      <!-- Login -->

      <button
        type="submit"
        [disabled]="loading"
        class="w-full rounded-xl bg-indigo-600 py-3.5
               font-semibold text-white shadow-lg
               transition duration-200
               hover:bg-indigo-700
               hover:shadow-xl
               disabled:cursor-not-allowed
               disabled:opacity-60"
      >

        <span *ngIf="!loading">
          Login
        </span>

        <span
          *ngIf="loading"
          class="flex items-center justify-center gap-2"
        >

          <span
            class="h-5 w-5 animate-spin rounded-full
                   border-2 border-white border-t-transparent"
          ></span>

          Logging in...

        </span>

      </button>

    </form>


    <!-- Register -->

    <p class="mt-8 text-center text-sm text-slate-500">

      Don't have an account?

      <button
        type="button"
        (click)="openRegister()"
        class="ml-1 font-semibold text-indigo-600 hover:text-indigo-700"
      >
        Create Account
      </button>

    </p>

  </div>



  <!-- ========================= -->
  <!-- REGISTER MODAL -->
  <!-- ========================= -->

  <div
    *ngIf="isRegisterMode"
    class="w-full max-w-md rounded-3xl bg-white p-8 shadow-2xl"
  >

    <!-- Header -->

    <div class="mb-6">

      <div class="flex items-center justify-between">

        <div
          class="flex h-10 w-10 items-center justify-center
                 rounded-xl bg-indigo-100 text-xl"
        >
          👤
        </div>

        <button
          type="button"
          (click)="openLogin()"
          class="flex h-9 w-9 items-center justify-center
                 rounded-full bg-slate-100 text-slate-500
                 hover:bg-slate-200"
        >
          ✕
        </button>

      </div>


      <h2 class="mt-5 text-2xl font-bold text-slate-900">
        Create Account
      </h2>

      <p class="mt-1 text-sm text-slate-500">
        Create your account to access the products dashboard.
      </p>

    </div>


    <!-- Error -->

    <div
      *ngIf="errorMessage"
      class="mb-5 rounded-xl border border-red-200
             bg-red-50 px-4 py-3 text-sm text-red-700"
    >
      {{ errorMessage }}
    </div>


    <!-- Register Form -->

    <form
      class="space-y-4"
      (ngSubmit)="register()"
    >

      <!-- Username -->

      <div>

        <label
          for="registerUsername"
          class="mb-2 block text-sm font-medium text-slate-700"
        >
          Username
        </label>

        <input
          id="registerUsername"
          name="registerUsername"
          type="text"
          [(ngModel)]="registerName"
          placeholder="Enter username"
          autocomplete="username"
          required
          class="w-full rounded-xl border border-slate-300
                 px-4 py-3 outline-none
                 focus:border-indigo-500
                 focus:ring-2 focus:ring-indigo-100"
        />

      </div>


      <!-- Email -->

      <div>

        <label
          for="registerEmail"
          class="mb-2 block text-sm font-medium text-slate-700"
        >
          Email
        </label>

        <input
          id="registerEmail"
          name="registerEmail"
          type="email"
          [(ngModel)]="registerEmail"
          placeholder="Enter email"
          autocomplete="email"
          required
          class="w-full rounded-xl border border-slate-300
                 px-4 py-3 outline-none
                 focus:border-indigo-500
                 focus:ring-2 focus:ring-indigo-100"
        />

      </div>


      <!-- Phone -->

      <div>

        <label
          for="registerPhone"
          class="mb-2 block text-sm font-medium text-slate-700"
        >
          Phone
        </label>

        <input
          id="registerPhone"
          name="registerPhone"
          type="tel"
          [(ngModel)]="registerPhone"
          placeholder="Enter phone number"
          autocomplete="tel"
          required
          class="w-full rounded-xl border border-slate-300
                 px-4 py-3 outline-none
                 focus:border-indigo-500
                 focus:ring-2 focus:ring-indigo-100"
        />

      </div>


      <!-- Password -->

      <div>

        <label
          for="registerPassword"
          class="mb-2 block text-sm font-medium text-slate-700"
        >
          Password
        </label>

        <input
          id="registerPassword"
          name="registerPassword"
          type="password"
          [(ngModel)]="registerPassword"
          placeholder="Enter password"
          autocomplete="new-password"
          required
          class="w-full rounded-xl border border-slate-300
                 px-4 py-3 outline-none
                 focus:border-indigo-500
                 focus:ring-2 focus:ring-indigo-100"
        />

        <p class="mt-1 text-xs text-slate-400">
          Use at least 6 characters.
        </p>

      </div>


      <!-- Register Button -->

      <button
        type="submit"
        [disabled]="loading"
        class="w-full rounded-xl bg-indigo-600 py-3.5
               font-semibold text-white shadow-lg
               transition
               hover:bg-indigo-700
               disabled:cursor-not-allowed
               disabled:opacity-60"
      >

        <span *ngIf="!loading">
          Create Account
        </span>

        <span
          *ngIf="loading"
          class="flex items-center justify-center gap-2"
        >

          <span
            class="h-5 w-5 animate-spin rounded-full
                   border-2 border-white border-t-transparent"
          ></span>

          Creating account...

        </span>

      </button>

    </form>


    <!-- Login -->

    <p class="mt-6 text-center text-sm text-slate-500">

      Already have an account?

      <button
        type="button"
        (click)="openLogin()"
        class="ml-1 font-semibold text-indigo-600 hover:text-indigo-700"
      >
        Login
      </button>

    </p>

  </div>

</div>
